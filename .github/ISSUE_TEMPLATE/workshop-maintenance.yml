name: Workshop Maintenance
description: Track updates to workshop content, event packets, setup docs, or repo checks.
title: "[Maintenance]: "
labels:
  - maintenance
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What curriculum, event packet, tool track, setup guide, selected-framework teaching alignment, or repo workflow needs work?
      placeholder: Describe the specific repo area and why it needs attention.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include current behavior, desired behavior, and any event deadline.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Required Checks
      options:
        - label: Public-facing content avoids secrets, private data, and sensitive operational details.
          required: true
        - label: Local links and event metadata should be updated if navigation changes.
          required: false
        - label: Changelog should be updated if this changes public material or maintainer workflow.
          required: false
        - label: Claims about Commons or a selected framework should be checked against that product's canonical source and AI Dev Days' independence boundary.
          required: false
