name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repo-and-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/beaver-badges/app/package-lock.json

      - name: Install Beaver Badges dependencies
        working-directory: projects/beaver-badges/app
        run: npm ci

      - name: Install Playwright browser
        working-directory: projects/beaver-badges/app
        run: npx playwright install --with-deps chromium

      - name: Install pinned publication scanner
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate release candidate
        env:
          VISUAL_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/visual-smoke
        run: ./scripts/validate-release.sh

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-smoke
          path: ${{ runner.temp }}/visual-smoke
          if-no-files-found: ignore
